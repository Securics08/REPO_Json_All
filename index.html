<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON VAULT v15.7 - Security & Drive</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Segoe+UI&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-pink: #ff00ff;
            --bg-dark: #050505;
            --panel-bg: rgba(20, 20, 20, 0.9);
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        #lock-screen {
            text-align: center;
            z-index: 1000;
        }

        .neon-input {
            background: transparent;
            border: 2px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 10px;
            font-family: 'Orbitron', sans-serif;
            text-align: center;
            font-size: 1.5rem;
            box-shadow: 0 0 10px var(--neon-blue);
            outline: none;
            border-radius: 5px;
        }

        #main-content {
            display: none;
            width: 95%;
            max-width: 900px;
            padding: 20px;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 30px;
            padding: 15px;
            border: 1px solid var(--neon-blue);
            background: rgba(0, 242, 255, 0.05);
            border-radius: 10px;
        }

        .note-card {
            background: var(--panel-bg);
            border: 1px solid var(--neon-pink);
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.1);
            border-radius: 8px;
            word-wrap: break-word;
        }

        .media-container img {
            max-width: 100%;
            height: auto;
            border: 1px solid var(--neon-blue);
            margin-top: 15px;
            border-radius: 5px;
        }

        .media-container iframe {
            width: 100%;
            height: 450px;
            border: 1px solid var(--neon-blue);
            margin-top: 15px;
            border-radius: 5px;
        }

        button {
            background: transparent;
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 10px 20px;
            cursor: pointer;
            font-family: 'Orbitron';
            text-transform: uppercase;
            transition: 0.3s;
        }

        button:hover {
            background: var(--neon-blue);
            color: black;
            box-shadow: 0 0 15px var(--neon-blue);
        }

        .delete-btn {
            border-color: var(--neon-pink);
            color: var(--neon-pink);
            margin-top: 10px;
        }

        .delete-btn:hover {
            background: var(--neon-pink);
            color: white;
        }
    </style>
</head>
<body>

<div id="lock-screen">
    <h1 style="font-family: 'Orbitron'; color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue);">NEON VAULT ACCESS</h1>
    <input type="password" id="pin-input" class="neon-input" placeholder="CODE" maxlength="8">
    <p id="error-msg" style="color: var(--neon-pink); margin-top: 15px; display: none; font-family: 'Orbitron';">ACCESS DENIED</p>
</div>

<div id="main-content">
    <header>
        <h1 style="font-family: 'Orbitron'; color: var(--neon-pink); margin-bottom: 20px;">STATION: NEON-VAULT v15.7</h1>
        <div class="controls">
            <button onclick="addNote()">+ Új Jegyzet / Drive Link</button>
            <button onclick="changePin()" style="border-color: #ffea00; color: #ffea00;">🔑 Kód Módosítása</button>
            <button onclick="location.reload()">🔒 Kijelentkezés</button>
        </div>
    </header>
    <div id="notes-list"></div>
</div>

<script>
    // Adatok betöltése
    let currentPin = localStorage.getItem('vault_pin') || "0000";
    let notes = JSON.parse(localStorage.getItem('neon_notes')) || [];

    const pinInput = document.getElementById('pin-input');
    const lockScreen = document.getElementById('lock-screen');
    const mainContent = document.getElementById('main-content');
    const notesList = document.getElementById('notes-list');

    // Belépés figyelése
    pinInput.addEventListener('input', () => {
        if(pinInput.value === currentPin) {
            lockScreen.style.display = 'none';
            mainContent.style.display = 'block';
            renderNotes();
        } else if (pinInput.value.length >= currentPin.length) {
            document.getElementById('error-msg').style.display = 'block';
            setTimeout(() => { 
                pinInput.value = ''; 
                document.getElementById('error-msg').style.display = 'none';
            }, 800);
        }
    });

    // Kód módosítása funkció
    function changePin() {
        const newPin = prompt("Add meg az új titkos kódodat:");
        if (newPin && newPin.trim().length > 0) {
            const confirmPin = prompt("Megerősítés - Írd be újra:");
            if (newPin === confirmPin) {
                currentPin = newPin;
                localStorage.setItem('vault_pin', newPin);
                alert("Kód elmentve! Legközelebb már ezzel tudsz belépni.");
            } else {
                alert("Hiba: A két kód nem egyezik!");
            }
        }
    }

    // Google Drive link átalakító
    function transformDriveLink(url) {
        if (url.includes('drive.google.com')) {
            let fileId = "";
            try {
                if (url.includes('id=')) {
                    fileId = url.split('id=')[1].split('&')[0];
                } else {
                    fileId = url.split('/d/')[1].split('/')[0];
                }
                // Közvetlen kép link generálása
                return `https://docs.google.com/uc?export=view&id=${fileId}`;
            } catch (e) { return url; }
        }
        return url;
    }

    function addNote() {
        const content = prompt("Írj be jegyzetet vagy illessz be egy Google Drive linket:");
        if (content) {
            notes.push({ id: Date.now(), text: content });
            saveAndRender();
        }
    }

    function saveAndRender() {
        localStorage.setItem('neon_notes', JSON.stringify(notes));
        renderNotes();
    }

    function renderNotes() {
        notesList.innerHTML = '';
        notes.sort((a, b) => b.id - a.id).forEach(note => {
            const card = document.createElement('div');
            card.className = 'note-card';
            
            let html = `<p style="white-space: pre-wrap;">${note.text}</p>`;
            
            // Ha Drive link, beágyazzuk
            if (note.text.includes('drive.google.com')) {
                const directImg = transformDriveLink(note.text);
                html += `
                    <div class="media-container">
                        <p style="font-size: 10px; color: var(--neon-blue); font-family: 'Orbitron';">DRIVE STORAGE ACTIVE</p>
                        <img src="${directImg}" alt="Kép betöltése..." onerror="this.style.display='none';">
                        <iframe src="${note.text.replace('/view', '/preview').replace('/edit', '/preview')}" allow="autoplay"></iframe>
                    </div>`;
            }

            card.innerHTML = html + `<button class="delete-btn" onclick="deleteNote(${note.id})">Törlés</button>`;
            notesList.appendChild(card);
        });
    }

    function deleteNote(id) {
        if(confirm("Törlöd ezt a bejegyzést?")) {
            notes = notes.filter(n => n.id !== id);
            saveAndRender();
        }
    }
</script>

</body>
</html>
