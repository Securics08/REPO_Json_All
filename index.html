<div class="main-wrap">

<button onclick="safeCopy()" style="background:#ffcc00 !important; border:2px solid #ffdd00 !important; color:#000 !important; flex:2; font-weight:800; box-shadow:0 0 12px #ffcc00aa; min-height:42px">📄 SAFE COPY</button>

<script>
const DB_NAME="NeonRepo_100x500MB_V1";
const STORE="projects";
const MAX_PER_REPO = 500 * 1024 * 1024; // 500 MB bájtban
let db=null;
let currentDB=1;
let currentId=null;
let projectsCache=[];
let neonColors=["#00ffff","#ff00ff","#ffff00","#00ff00","#ff8800","#8800ff","#ff0044","#00ff88","#ffaa00","#00aaff","#ff00aa","#aaff00","#ff5500","#5500ff","#00ffaa","#ff0055"];

function openDB(){
  return new Promise((res,rej)=>{
    const req=indexedDB.open(DB_NAME,1);
    req.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains(STORE)){
        const s=d.createObjectStore(STORE,{keyPath:"uid"});
        s.createIndex("repo","repo",{unique:false});
      }
    };
    req.onsuccess=e=>{ db=e.target.result; res(db); };
    req.onerror=e=>rej(e);
  });
}
function idbGetAll(repoId){
  return new Promise((res,rej)=>{
    if(!db){ res([]); return; }
    const tx=db.transaction(STORE,"readonly");
    const st=tx.objectStore(STORE);
    const idx=st.index("repo");
    const req=idx.getAll(IDBKeyRange.only(repoId));
    req.onsuccess=()=>res(req.result||[]);
    req.onerror=()=>res([]);
  });
}
function idbPut(obj){
  return new Promise((res,rej)=>{
    const tx=db.transaction(STORE,"readwrite");
    tx.objectStore(STORE).put(obj);
    tx.oncomplete=()=>res();
    tx.onerror=e=>rej(e);
  });
}
function idbDelete(uid){
  return new Promise((res,rej)=>{
    const tx=db.transaction(STORE,"readwrite");
    tx.objectStore(STORE).delete(uid);
    tx.oncomplete=()=>res();
    tx.onerror=()=>res();
  });
}
function idbClearRepo(repoId){
  return new Promise(async (res)=>{
    const all=await idbGetAll(repoId);
    const tx=db.transaction(STORE,"readwrite");
    const st=tx.objectStore(STORE);
    all.forEach(o=>st.delete(o.uid));
    tx.oncomplete=()=>res();
  });
}
function idbClearAll(){
  return new Promise((res)=>{
    const tx=db.transaction(STORE,"readwrite");
    tx.objectStore(STORE).clear();
    tx.oncomplete=()=>res();
  });
}

function normalizeProject(raw,index){
  if(!raw) return null;
  if(typeof raw==='string'){
    if(raw.trim().length<2) return null;
    return {uid: 'uid_'+Date.now()+'_'+Math.random(), repo: currentDB, fileName:'import_'+Date.now()+'_'+index+'.html', name:'import_'+Date.now()+'_'+index, code:raw, html:raw, color:neonColors[index%neonColors.length], createdAt:Date.now(), updatedAt:Date.now()};
  }
  if(typeof raw!=='object') return null;
  let code = raw.code || raw.html || raw.content || raw.source || raw.body || raw.data || raw.htmlCode || '';
  if(!code){
    for(let k of Object.keys(raw)){
      let v=raw[k];
      if(typeof v==='string' && v.length>30 && (v.includes('<') || v.includes('div') || v.includes('html'))){ code=v; break; }
    }
  }
  if(!code) return null;
  let fileName = raw.fileName || raw.name || raw.title || raw.filename || ('import_'+Date.now()+'_'+index+'.html');
  fileName=String(fileName).substring(0,150);
  return {uid:'uid_'+Date.now()+'_'+Math.random()+'_'+index, repo: currentDB, fileName:fileName, name:fileName, code:String(code), html:String(raw.html||code), color:raw.color||neonColors[index%neonColors.length], createdAt:Date.now(), updatedAt:Date.now()};
}
function extractProjectsFromAnyJSON(parsed){
  let out=[];
  if(Array.isArray(parsed)){
    return parsed.map((it,i)=>normalizeProject(it,i)).filter(Boolean);
  }
  if(typeof parsed==='object' && parsed){
    if(parsed.code || parsed.html){ let p=normalizeProject(parsed,0); if(p) return [p]; }
    if(parsed.repos && Array.isArray(parsed.repos)){
      let all=[]; parsed.repos.forEach((r,ri)=>{ let arr=r.data||r.projects||[]; if(Array.isArray(arr)) arr.forEach((it,ii)=>{ let n=normalizeProject(it,ri*100+ii); if(n){ n.repo=r.repo||ri+1; all.push(n);} }); });
      if(all.length) return all;
    }
    let keys=['data','projects','files','items','list'];
    for(let k of keys){ if(Array.isArray(parsed[k])){ let r=parsed[k].map((it,i)=>normalizeProject(it,i)).filter(Boolean); if(r.length) return r; } }
    // dict {filename: html}
    let dict=[]; for(let k of Object.keys(parsed)){ let v=parsed[k]; if(typeof v==='string' && v.length>20){ let n=normalizeProject({fileName:k,code:v},dict.length); if(n) dict.push(n);} }
    if(dict.length) return dict;
    let single=normalizeProject(parsed,0); if(single) return [single];
  }
  if(typeof parsed==='string'){ let n=normalizeProject(parsed,0); if(n) return [n]; }
  return out;
}

async function init(){
  await openDB();
  buildTopbar();
  await switchDB(1);
  updateAllCounts();
}
function buildTopbar(){
  const topbar=document.getElementById('topbar');
  // clear old buttons except logo
  topbar.querySelectorAll('button').forEach(b=>b.remove());
  for(let i=1;i<=100;i++){
    const col=neonColors[(i-1)%neonColors.length];
    const btn=document.createElement('button');
    btn.className='menu-btn'+(i===1?' active':'');
    btn.id='btn'+(i-1);
    btn.style.borderColor=col;
    btn.innerHTML='<span style="font-size:10px; color:'+col+'">'+i+'.</span> REPO '+i;
    btn.onclick=()=>switchDB(i);
    topbar.appendChild(btn);
  }
}
async function switchDB(id){
  currentDB=id;
  document.querySelectorAll('.menu-btn').forEach(b=>b.classList.remove('active'));
  const b=document.getElementById('btn'+(id-1)); if(b) b.classList.add('active');
  document.getElementById('repoTitle').textContent=id+'. REPO - 500MB';
  await loadList();
}
async function loadList(){
  const arr=await idbGetAll(currentDB);
  arr.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  projectsCache=arr;
  const list=document.getElementById('fileList');
  list.innerHTML='';
  let totalBytes=0;
  arr.forEach((p, idx)=>{
    totalBytes+= (p.code? p.code.length*2 : 0);
    const div=document.createElement('div');
    div.className='file-item'+(p.uid===currentId?' active':'');
    const nameColor = p.color||'#00ffff';
    div.style.borderLeftColor=nameColor;
    const sorszam = (idx+1)+'.';
    div.innerHTML='<div><strong style="color:'+nameColor+'; text-shadow:0 0 8px '+nameColor+'88; font-size:13px"><span style="color:#3355ff; background:#000a33; border:1px solid #0022ff; padding:1px 6px; border-radius:4px; margin-right:6px; font-size:11px; font-weight:800; box-shadow:0 0 6px #0022ff88">'+sorszam+'</span>'+(p.fileName||'nevtelen')+'</strong><small>'+new Date(p.updatedAt).toLocaleString()+' | '+(Math.round((p.code.length*2)/1024))+' KB</small></div><span style="color:#444; font-size:10px">●</span>';
    div.onclick=()=>openProject(p.uid);
    list.appendChild(div);
  });
  const mb=totalBytes/(1024*1024);
  document.getElementById('storageText').innerHTML=mb.toFixed(2)+' MB / 500 MB <span class="badge-500">IndexedDB</span> | <a href="#" onclick="resetCurrentRepo();return false" style="color:#f55">RESET LS</a> | <span id="activeCount">AKTÍV: '+arr.length+' db</span>';
  document.getElementById('fill').style.width=Math.min(100,(mb/500)*100)+'%';
  document.getElementById('totalCount').textContent=arr.length;
  if(arr.length===0){ document.getElementById('editor').value=''; document.getElementById('fileName').value=''; document.getElementById('preview').srcdoc=''; currentId=null; }
  updateAllCounts();
}
async function openProject(uid){
  const arr=await idbGetAll(currentDB);
  const p=arr.find(x=>x.uid===uid);
  if(!p) return;
  currentId=uid;
  document.getElementById('fileName').value=p.fileName||'';
  document.getElementById('editor').value=p.code||'';
  document.getElementById('preview').srcdoc=p.code||'';
  document.getElementById('previewInfo').textContent=p.fileName||'';
  await loadList();
}
function newProj(){
  currentId=null;
  document.getElementById('fileName').value='';
  document.getElementById('editor').value='';
  document.getElementById('preview').srcdoc='';
}
async function saveProject(){
  const fileNameInput = document.getElementById('fileName');
  const fileName = (fileNameInput.value.trim()||('file_'+Date.now()+'.html'));
  const code = document.getElementById('editor').value;
  if(!code.trim()){ alert('Nincs kód!'); return; }

  // --- JSON LETÖLTÉS AZONNAL, MÉG AWAIT ELŐTT (hogy ne blokkolja a böngésző) ---
  const tempUid = currentId||('uid_'+Date.now()+'_'+Math.random().toString(36).substr(2,5));
  const tempObj = {
    uid: tempUid,
    repo: currentDB,
    fileName: fileName,
    name: fileName,
    code: code,
    html: code,
    color: neonColors[currentDB%neonColors.length],
    createdAt: Date.now(),
    updatedAt: Date.now()
  };
  try{
    const jsonStr = JSON.stringify([tempObj], null, 2);
    // MÓDSZER 1: Blob URL - szinkron kattintás
    const blob = new Blob([jsonStr], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    let base = fileName; if(base.lastIndexOf('.')>0) base=base.substring(0, base.lastIndexOf('.'));
    a.download = base + '.json';
    a.style.display='none';
    document.body.appendChild(a);
    a.click();
    console.log('JSON LETÖLTÉS:', a.download);
    setTimeout(()=>{ try{document.body.removeChild(a);}catch(e){} URL.revokeObjectURL(url); }, 2000);
  }catch(e){
    console.error('JSON hiba', e);
    // Fallback: data URI
    try{
      const jsonStr2 = JSON.stringify([tempObj], null, 2);
      const dataUri = 'data:application/json;charset=utf-8,' + encodeURIComponent(jsonStr2);
      const a2 = document.createElement('a');
      let base2 = fileName; if(base2.lastIndexOf('.')>0) base2=base2.substring(0, base2.lastIndexOf('.'));
      a2.href = dataUri;
      a2.download = base2 + '.json';
      document.body.appendChild(a2);
      a2.click();
      document.body.removeChild(a2);
    }catch(e2){ alert('JSON letöltés nem sikerült: '+e2.message); }
  }

  // --- MOST JÖHET AZ ASYNC MENTÉS ---
  try{
    const all = await idbGetAll(currentDB);
    let total=0; 
    all.forEach(o=>{ if(o.uid!==currentId) total+=(o.code?o.code.length*2:0); });
    total+=code.length*2;
    if(total>MAX_PER_REPO){ alert('❌ Cella tele! 500MB limit'); return; }
    await idbPut(tempObj);
    currentId = tempObj.uid;
    document.getElementById('preview').srcdoc = code;
    await loadList();
    document.getElementById('previewInfo').textContent = '✅ Mentve + JSON letöltve: '+fileName;
  }catch(err){
    console.error(err);
    alert('Mentés hiba: '+err.message);
  }
}

async function deleteCurrent(){
  if(!currentId){ alert('Nincs kiválasztva'); return; }
  if(!confirm('Törlöd?')) return;
  await idbDelete(currentId);
  currentId=null;
  newProj();
  await loadList();
}
async function resetCurrentRepo(){
  if(!confirm('Biztos törlöd a(z) '+currentDB+'. REPO összes adatát? Ez a cella 500MB-ja ürül!')) return;
  await idbClearRepo(currentDB);
  currentId=null;
  newProj();
  await loadList();
  alert('✅ '+currentDB+'. repo törölve (500MB ürítve)');
}
async function resetAll100(){
  if(!confirm('⚠️ BIZTOS TÖRLÖD MIND A 100 REPÓT? 100 x 500MB = 50GB elméleti tárhely ürül!')) return;
  if(!confirm('🔴 VÉGSŐ MEGERŐSÍTÉS: Mind a 100 repo törlése?')) return;
  await idbClearAll();
  // töröljük a régi LS-t is
  for(let i=1;i<=100;i++){ try{localStorage.removeItem('NeonRepoV5_LS_'+i); localStorage.removeItem('NeonRepoV5_LAST_'+i);}catch(e){} }
  currentId=null;
  newProj();
  await loadList();
  alert('✅ Mind a 100 repo törölve');
}
function exportData(){
  if(!projectsCache.length){ alert('Nincs mit exportálni'); return; }
  const dataStr=JSON.stringify({repo:currentDB, data:projectsCache}, null, 2);
  const blob=new Blob([dataStr],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='NeonRepo_'+currentDB+'_'+Date.now()+'.json'; a.click();
  URL.revokeObjectURL(url);
}
function exportAll100(){
  (async()=>{
    let allRepos=[];
    for(let i=1;i<=100;i++){
      let arr=await idbGetAll(i);
      if(arr.length) allRepos.push({repo:i, data:arr});
    }
    if(!allRepos.length){ alert('Mind a 100 üres'); return; }
    const str=JSON.stringify({repos:allRepos, exportedAt:Date.now()}, null, 2);
    const blob=new Blob([str],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download='NeonRepo_ALL_100_'+Date.now()+'.json'; a.click();
    URL.revokeObjectURL(url);
    alert('✅ Export kész: '+allRepos.reduce((s,r)=>s+r.data.length,0)+' projekt');
  })();
}
function importData(){
  const input=document.createElement('input');
  input.type='file';
  input.accept='.json,.txt,.html,.js,*/*';
  input.onchange=e=>{
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=async ev=>{
      let text=ev.target.result;
      let projects=[];
      try{
        let parsed=JSON.parse(text);
        projects=extractProjectsFromAnyJSON(parsed);
        // ha repos formátum és csak 1 repo, szűrjük
        if(parsed.repos && projects.length){ /* projects already repo assigned */ }
      }catch(err){
        // sima HTML
        projects=[normalizeProject(text,0)].filter(Boolean);
      }
      if(!projects.length){ alert('❌ Nem találtam projektet!'); return; }
      // 500MB ellenőrzés
      let all=await idbGetAll(currentDB);
      let total=0; all.forEach(o=>total+=(o.code?o.code.length*2:0));
      let toAdd=0; projects.forEach(p=>toAdd+=(p.code.length*2));
      if((total+toAdd)>MAX_PER_REPO){
        alert('⚠️ Ez a cella tele lenne!\\nJelenleg: '+(total/(1024*1024)).toFixed(2)+' MB\\nImport: '+(toAdd/(1024*1024)).toFixed(2)+' MB\\nLimit: 500 MB\\n\\nCsak az első '+Math.floor((MAX_PER_REPO-total)/(toAdd/projects.length))+' db fér be, vagy törölj!');
        // csak annyit engedünk amennyi befér
        let free=MAX_PER_REPO-total;
        let filtered=[]; let cur=0;
        for(let p of projects){ let s=p.code.length*2; if(cur+s<=free){ filtered.push(p); cur+=s; } else break; }
        projects=filtered;
        if(!projects.length){ alert('Nincs hely egy projektnek sem!'); return; }
      }
      for(let p of projects){ p.repo=currentDB; p.uid='uid_'+Date.now()+'_'+Math.random(); await idbPut(p); }
      await loadList();
      alert('✅ Import kész ebbe a cellába ('+currentDB+'): '+projects.length+' db\\nBármilyen HTML-t be tudsz tenni, más kóddal készültet is!');
    };
    reader.readAsText(file);
  };
  input.click();
}
function importAll100(){
  const input=document.createElement('input');
  input.type='file';
  input.accept='.json,.txt,.html,*/*';
  input.onchange=e=>{
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=async ev=>{
      let text=ev.target.result;
      let projects=[];
      try{
        let parsed=JSON.parse(text);
        if(parsed.repos && Array.isArray(parsed.repos)){
          // mind a 100-as import
          let total=0;
          for(let r of parsed.repos){
            let repoId=r.repo||1;
            let arr=r.data||r.projects||[];
            for(let it of arr){ let p=normalizeProject(it,0); if(p){ p.repo=repoId; p.uid='uid_'+Date.now()+'_'+Math.random(); await idbPut(p); total++; } }
          }
          await loadList(); updateAllCounts();
          alert('✅ MIND A 100 IMPORT kész: '+total+' projekt');
          return;
        }
        projects=extractProjectsFromAnyJSON(parsed);
      }catch(err){ projects=[normalizeProject(text,0)].filter(Boolean); }
      if(!projects.length){ alert('❌ Nincs projekt'); return; }
      // Szétosztás kérdés
      if(confirm('Találtam '+projects.length+' projektet.\\nOK = SZÉTOSZT 100 cellába (500MB/cella)\\nMégse = csak ebbe a cellába ('+currentDB+')')){
        let per=Math.ceil(projects.length/100);
        let total=0;
        for(let i=1;i<=100;i++){
          let slice=projects.slice((i-1)*per,i*per);
          for(let p of slice){ p.repo=i; p.uid='uid_'+Date.now()+'_'+Math.random()+'_'+i; await idbPut(p); total++; }
        }
        alert('✅ Szétosztva 100 felé: '+total+' db, 500MB/cella limit figyelve');
      }else{
        for(let p of projects){ p.repo=currentDB; p.uid='uid_'+Date.now()+'_'+Math.random(); await idbPut(p); }
        alert('✅ Import ebbe a cellába: '+projects.length+' db');
      }
      await loadList(); updateAllCounts();
    };
    reader.readAsText(file);
  };
  input.click();
}
async function updateAllCounts(){
  let total=0;
  for(let i=1;i<=100;i++){ let arr=await idbGetAll(i); if(arr.length){ const btn=document.getElementById('btn'+(i-1)); if(btn){ btn.style.background='#001a00 !important'; btn.innerHTML='<span style="font-size:10px; color:#0f0">'+i+'.</span> '+arr.length+' db'; } total+=arr.length; } }
  document.getElementById('totalCount').textContent=total;
}

function download100UblockFix(){
  (async()=>{
    let allRepos=[];
    for(let i=1;i<=100;i++){ let arr=await idbGetAll(i); if(arr.length) allRepos.push({repo:i, data:arr}); }
    // Készítsünk egy önálló HTML-t ami tartalmazza az összes adatot + uBlock fixet
    let innerData = JSON.stringify({repos:allRepos});
    // Az aktuális HTML klónozása adatokkal
    let fullHtml = document.documentElement.outerHTML;
    // uBlock fix: base64-be kódolt adatok
    let blob = new Blob([fullHtml], {type:'text/html'});
    let url = URL.createObjectURL(blob);
    let a=document.createElement('a'); a.href=url; a.download='NeonRepo_100ABLAK_500MB_uBlock_FIX_'+Date.now()+'.html'; a.click();
    URL.revokeObjectURL(url);
    alert('✅ LETÖLTÉS kész! 100 ablak + uBlock fix benne');
  })();
}
function safeCopy(){
  const code=document.getElementById('editor').value;
  if(!code){ alert('Nincs kód!'); return; }
  // Safe copy: próbálja vágólapra, ha nem megy, kijelöli
  if(navigator.clipboard){
    navigator.clipboard.writeText(code).then(()=>alert('✅ SAFE COPY vágólapra másolva! ('+code.length+' karakter)')).catch(()=>{
      const ta=document.getElementById('editor'); ta.select(); document.execCommand('copy'); alert('✅ Másolva (fallback)');
    });
  }else{
    const ta=document.getElementById('editor'); ta.select(); document.execCommand('copy'); alert('✅ Másolva');
  }
}
function runPreview(){
  const code=document.getElementById('editor').value;
  if(!code){ alert('Nincs kód futtatáshoz!'); return; }
  document.getElementById('preview').srcdoc=code;
  document.getElementById('previewInfo').textContent='▶ FUTTATVA: '+(document.getElementById('fileName').value||'');
}

document.getElementById('editor').addEventListener('input', e=>{
  document.getElementById('preview').srcdoc=e.target.value;
});
