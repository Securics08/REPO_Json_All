<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Vault v16.0 - Restore</title>
    <style>
        :root { 
            --bg-dark: #01040a; --neon-red: #ff0000; --neon-blue: #0044ff; --neon-green: #39ff14; 
            --neon-yellow: #ffff00; --neon-cyan: #00ffff; --neon-magenta: #ff00ff;
            --neon-orange: #ffaa00; --neon-white: #ffffff; --neon-pink: #ff00ff; --neon-blue-ui: #00f2ff;
        }
        
        @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Dancing+Script:wght@400;700&family=MedievalSharp&family=Press+Start+2P&family=Monoton&family=Orbitron:wght@400;900&display=swap');

        body { background-color: var(--bg-dark); color: #d1d9e6; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        #lock-screen { position: fixed; inset: 0; background: #000; z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .storage-container { width: 100%; max-width: 950px; margin-bottom: 25px; text-align: center; }
        #storage-monitor { width: 100%; background: #000; border: 2px solid var(--neon-blue-ui); height: 20px; border-radius: 10px; overflow: hidden; margin-top: 8px; }
        #storage-bar { height: 100%; width: 0%; transition: width 0.5s; background: var(--neon-blue-ui); box-shadow: 0 0 10px var(--neon-blue-ui); }
        #storage-text { font-size: 18px; color: var(--neon-yellow); font-family: 'Orbitron'; font-weight: bold; }

        .container { width: 100%; max-width: 1000px; }
        .btn-group { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 20px; }
        button { background: transparent; border: 2px solid var(--neon-pink); color: var(--neon-pink); padding: 8px 15px; cursor: pointer; text-transform: uppercase; font-weight: bold; border-radius: 4px; transition: 0.2s; font-family: 'Orbitron', sans-serif; font-size: 12px; }
        button:hover { background: var(--neon-pink); color: #000; box-shadow: 0 0 15px var(--neon-pink); }

        #search-input { background: #000; border: 2px solid var(--neon-green); color: var(--neon-green); padding: 8px; border-radius: 5px; font-family: 'Orbitron'; margin-bottom: 15px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 0 5px var(--neon-green); }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; width: 100%; align-items: start; }
        .item-card { border: 3px solid; border-radius: 15px; cursor: pointer; text-align: center; background: rgba(0,0,0,0.85); position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: 0.2s; padding: 10px; overflow: hidden; box-sizing: border-box; align-self: start; }
        
        .card-micro { height: 45px !important; min-height: 45px !important; padding: 2px; }
        .card-micro svg, .card-micro .card-date, .card-micro .open-folder-btn { display: none !important; }

        .card-tiny { height: 85px !important; min-height: 85px !important; padding: 5px; }
        .card-tiny svg { width: 22px; height: 22px; }
        .card-tiny .card-date, .card-tiny .open-folder-btn { display: none !important; }

        .card-small { height: 130px !important; min-height: 130px !important; }
        .card-normal { height: 190px !important; min-height: 190px !important; }
        .card-medium-wide { height: 190px !important; min-height: 190px !important; grid-column: span 2; }
        .card-large { height: 250px !important; min-height: 250px !important; grid-column: span 2; }
        .card-huge { height: 380px !important; min-height: 380px !important; grid-column: span 2; grid-row: span 2; }
        .card-panorama { height: 60px !important; min-height: 60px !important; grid-column: 1 / -1; flex-direction: row; gap: 20px; }
        .card-panorama .card-date, .card-panorama .open-folder-btn { display: none !important; }
        .card-cinema { height: 180px !important; min-height: 180px !important; grid-column: 1 / -1; border-width: 5px; }

        .card-name { font-weight: 900; word-break: break-all; line-height: 1.1; margin: 2px; }
        .card-date { font-size: 10px; opacity: 0.7; margin-top: 5px; color: #fff; font-family: sans-serif; }
        .del-btn { position: absolute; top: 5px; right: 5px; color: #ff0000; font-weight: bold; cursor: pointer; z-index: 5; background: #000; padding: 1px 5px; border: 1px solid #ff0000; font-size: 10px; }
        .open-folder-btn { margin-top: 8px; font-size: 9px; border-color: var(--neon-blue-ui); color: var(--neon-blue-ui); padding: 2px 5px; }

        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #050505; border: 4px solid var(--neon-pink); padding: 25px; z-index: 1000; border-radius: 15px; width: 85%; max-width: 750px; box-shadow: 0 0 60px #000; overflow-y: auto; max-height: 90vh; }
        input, textarea, select { background: #111; border: 1px solid var(--neon-blue-ui); color: #fff; padding: 10px; margin-bottom: 10px; width: 100%; box-sizing: border-box; border-radius: 5px; }
        .file-item { display: flex; align-items: center; justify-content: space-between; background: #111; padding: 5px; border: 1px solid var(--neon-blue-ui); margin: 2px; border-radius: 4px; font-size: 11px; width: 100%; }
        .preview-img { width: 45px; height: 45px; object-fit: cover; border: 1px solid var(--neon-blue-ui); cursor: zoom-in; }
        #cinema-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 20000; align-items: center; justify-content: center; cursor: zoom-out; }
        #cinema-overlay img { max-width: 95vw; max-height: 95vh; border: 2px solid var(--neon-blue-ui); box-shadow: 0 0 30px var(--neon-blue-ui); }
    </style>
</head>
<body>

    <div id="cinema-overlay" onclick="this.style.display='none'">
        <img id="cinema-img" src="" alt="Cinema Preview">
    </div>

    <div id="lock-screen">
        <h1 style="color:var(--neon-blue-ui); font-family: 'Orbitron';">RENDSZER ZÁROLVA</h1>
        <input type="password" id="pass-input" style="width: 200px; text-align: center;" placeholder="KÓD">
        <button onclick="unlock()">BELÉPÉS</button>
    </div>

    <div class="storage-container">
        <div id="storage-text">ADATBÁZIS ÁLLAPOT</div>
        <div id="storage-monitor"><div id="storage-bar"></div></div>
    </div>

    <div class="container">
        <input type="text" id="search-input" placeholder="KERESÉS..." oninput="render()">
        
        <div class="btn-group">
            <button onclick="goBack()" id="back-btn" style="display:none; border-color:#fff; color:#fff;">← VISSZA</button>
            <button onclick="openCreator('folder')" style="border-color:var(--neon-cyan); color:var(--neon-cyan);">+ ÚJ MAPPA</button>
            <button onclick="openCreator('note')" style="border-color:var(--neon-magenta); color:var(--neon-magenta);">+ ÚJ JEGYZET</button>
            <button onclick="changeMasterPassword()" style="border-color:var(--neon-red); color:var(--neon-red);">🔐 JELSZÓ MÓDOSÍTÁSA</button>
            <button onclick="exportData()" style="border-color:var(--neon-yellow); color:var(--neon-yellow);">📤 EXPORT (IDŐVEL)</button>
            <button onclick="document.getElementById('import-file').click()" style="border-color:var(--neon-orange); color:var(--neon-orange);">📥 IMPORT</button>
            <input type="file" id="import-file" style="display:none;" onchange="importData(event)">
        </div>
        <div id="path-display" style="color:var(--neon-blue-ui); font-family: 'Orbitron'; font-size: 11px; margin-bottom: 10px;">GYÖKÉR</div>
        <div id="display-grid" class="grid"></div>
    </div>

    <div id="editor-modal" class="modal">
        <h2 id="modal-title" style="color:var(--neon-pink); font-family: 'Orbitron';">SZERKESZTÉS</h2>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
            <div>
                <label style="font-size:10px; color:var(--neon-cyan)">8 SZÍN</label>
                <select id="edit-color">
                    <option value="var(--neon-cyan)">Cyán</option><option value="var(--neon-red)">Piros</option>
                    <option value="var(--neon-blue)">Kék</option><option value="var(--neon-green)">Zöld</option>
                    <option value="var(--neon-yellow)">Sárga</option><option value="var(--neon-magenta)">Magenta</option>
                    <option value="var(--neon-orange)">Narancs</option><option value="var(--neon-white)">Fehér</option>
                </select>
            </div>
            <div>
                <label style="font-size:10px; color:var(--neon-cyan)">BETŰMÉRET</label>
                <select id="edit-font-size"></select>
            </div>
            <div>
                <label style="font-size:10px; color:var(--neon-cyan)">KÁRTYA MÉRET</label>
                <select id="edit-card-size">
                    <option value="card-micro">Ultra Kicsi</option>
                    <option value="card-tiny">Extra Kicsi</option>
                    <option value="card-small">Kicsi</option>
                    <option value="card-normal" selected>Normál</option>
                    <option value="card-medium-wide">Közepes-Széles</option>
                    <option value="card-large">Széles</option>
                    <option value="card-huge">Óriás</option>
                    <option value="card-panorama">Panoráma</option>
                    <option value="card-cinema">Mozi (Cinema)</option>
                </select>
            </div>
        </div>

        <label style="font-size:10px; color:var(--neon-cyan)">STÍLUS / BETŰTÍPUS:</label>
        <select id="edit-font-family" onchange="updateLiveStyle()">
            <optgroup label="Alap stílusok">
                <option value="Arial, sans-serif">Arial (Vékony alap)</option>
                <option value="'Segoe UI', sans-serif">Segoe UI (Modern)</option>
                <option value="Verdana, sans-serif">Verdana (Olvasható)</option>
            </optgroup>
            <optgroup label="Vastag & Mém">
                <option value="Impact, Charcoal, sans-serif">Impact (Brutál vastag)</option>
                <option value="'Arial Black', sans-serif">Arial Black (Tömör)</option>
            </optgroup>
            <optgroup label="Hacker & Retro">
                <option value="'Courier New', Courier, monospace">Courier (Írógép)</option>
                <option value="'Lucida Console', Monaco, monospace">Lucida (Terminál)</option>
                <option value="'Trebuchet MS', sans-serif">Trebuchet (Gamer)</option>
                <option value="'Press Start 2P', cursive">Retro 8-bit</option>
                <option value="'Orbitron', sans-serif">Orbitron (Sci-fi)</option>
            </optgroup>
            <optgroup label="Díszes & Elegáns">
                <option value="Georgia, serif">Georgia (Antik)</option>
                <option value="'Times New Roman', Times, serif">Times (Hivatalos)</option>
                <option value="'Palatino Linotype', serif">Palatino (Díszesebb)</option>
                <option value="'Copperplate', serif">Copperplate (Nagybetűs)</option>
            </optgroup>
            <optgroup label="Különleges">
                <option value="'Comic Sans MS', cursive">Comic Sans (Játékos)</option>
                <option value="'Dancing Script', cursive">Kézírás jellegű</option>
                <option value="'MedievalSharp', cursive">Fantasy stílus</option>
                <option value="'Monoton', cursive">Neon Gázcső</option>
            </optgroup>
        </select>

        <input type="text" id="edit-name" placeholder="Név..." oninput="updateLiveStyle()">

        <div id="note-only-fields">
            <textarea id="edit-content" style="height: 150px;" placeholder="Tartalom..." oninput="updateLiveStyle()"></textarea>
            <button onclick="copyToClipboard()" style="width:100%; border-color:var(--neon-cyan); color:var(--neon-cyan); margin-bottom:10px;">📋 SZÖVEG MÁSOLÁSA</button>
            <input type="file" id="edit-file" multiple>
        </div>
        <div id="file-download-zone" style="display: flex; flex-direction: column; margin-top: 10px;"></div>

        <div style="display:flex; gap:10px; margin-top:15px;">
            <button onclick="processSave()" style="flex:1; border-color:var(--neon-green); color:var(--neon-green);">MENTÉS</button>
            <button onclick="closeModal()" style="flex:1; border-color:#444; color:#444;">MÉGSE</button>
        </div>
    </div>

    <script>
        const DB_NAME = "NeonVault_v15_3"; 
        let db, vault = {id: "root", name: "Gyökér", type: "folder", children: [], pass: "0000"}, currentId = "root", pathStack = ["root"], editingItemId = null;

        const fsS = document.getElementById('edit-font-size');
        for(let i=8; i<=120; i+=2) {
            let o = document.createElement('option'); o.value = i+"px"; o.innerText = i+"px";
            if(i===18) o.selected = true; fsS.appendChild(o);
        }

        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = e => { e.target.result.createObjectStore("store"); };
        request.onsuccess = e => { db = e.target.result; loadFromDB(); };

        function loadFromDB() {
            const trans = db.transaction("store", "readonly");
            const req = trans.objectStore("store").get("main");
            req.onsuccess = () => { if (req.result) { vault = req.result; if(!vault.pass) vault.pass = "0000"; render(); } };
        }

        function saveToDB(cb) {
            const trans = db.transaction("store", "readwrite");
            trans.objectStore("store").put(vault, "main").onsuccess = () => { updateMB(); if(cb) cb(); };
        }

        function unlock() {
            if (document.getElementById('pass-input').value === vault.pass) document.getElementById('lock-screen').style.display = 'none';
            else alert("HIBÁS KÓD!");
        }

        function changeMasterPassword() {
            const oldPass = prompt("Kérlek, add meg a jelenlegi jelszót:");
            if (oldPass === null) return;
            if (oldPass !== vault.pass) { alert("Helytelen régi jelszó!"); return; }
            const newPass = prompt("Add meg az ÚJ jelszót:");
            if (!newPass) { alert("A jelszó nem lehet üres!"); return; }
            const confirmPass = prompt("Megerősítés - Add meg újra az új jelszót:");
            if (newPass === confirmPass) {
                vault.pass = newPass;
                saveToDB(() => alert("Jelszó sikeresen megváltoztatva!"));
            } else { alert("A két jelszó nem egyezik!"); }
        }

        function render() {
            const grid = document.getElementById('display-grid'); 
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            grid.innerHTML = "";
            const current = findNode(currentId, vault);
            document.getElementById('back-btn').style.display = currentId === "root" ? "none" : "inline-block";
            document.getElementById('path-display').innerText = "ELÉRÉS: " + pathStack.map(id => findNode(id, vault).name.toUpperCase()).join(" / ");
            
            let itemsToDisplay = current.children;
            if(searchTerm) { itemsToDisplay = itemsToDisplay.filter(i => i.name.toLowerCase().includes(searchTerm)); }

            itemsToDisplay.sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0)).forEach(item => {
                const card = document.createElement('div');
                card.className = `item-card ${item.displaySize || 'card-normal'}`;
                const color = item.color || 'var(--neon-cyan)';
                card.style.borderColor = color; card.style.color = color;
                
                let icon = item.type === 'folder' ? 
                    `<svg style="width:25px; height:25px;" viewBox="0 0 24 24" fill="${item.children.length?color:'none'}" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>` : 
                    `<div style="font-size:18px;">📄</div>`;

                let folderAction = item.type === 'folder' ? `<button class="open-folder-btn" onclick="event.stopPropagation(); enterFolder('${item.id}')">MEGNYITÁS</button>` : '';

                card.innerHTML = `<div class="del-btn" onclick="deleteItem(event, '${item.id}')">X</div>${icon}<div class="card-name" style="font-family:${item.fontFamily}; font-size:${item.fontSize}">${item.name}</div><div class="card-date">${item.date || ""}</div>${folderAction}`;
                
                card.onclick = () => { openEditor(item.id); };
                grid.appendChild(card);
            });
            updateMB();
        }

        function enterFolder(id) { pathStack.push(id); currentId = id; render(); }

        function openCreator(type) {
            editingItemId = null; window.modalMode = type;
            document.getElementById('modal-title').innerText = type==='folder' ? "ÚJ MAPPA" : "ÚJ JEGYZET";
            document.getElementById('edit-name').value = ""; 
            document.getElementById('edit-content').value = "";
            document.getElementById('note-only-fields').style.display = type==='note' ? 'block' : 'none';
            document.getElementById('file-download-zone').innerHTML = "";
            document.getElementById('editor-modal').style.display = 'block';
        }

        function openEditor(id) {
            const item = findNode(id, vault); editingItemId = id; window.modalMode = item.type;
            document.getElementById('modal-title').innerText = item.type === 'folder' ? "MAPPA SZERKESZTÉSE" : "JEGYZET SZERKESZTÉSE";
            document.getElementById('edit-name').value = item.name;
            document.getElementById('edit-color').value = item.color || "var(--neon-cyan)";
            document.getElementById('edit-font-family').value = item.fontFamily || "Arial, sans-serif";
            document.getElementById('edit-font-size').value = item.fontSize || "18px";
            document.getElementById('edit-card-size').value = item.displaySize || 'card-normal';
            document.getElementById('note-only-fields').style.display = item.type==='note' ? 'block' : 'none';
            if (item.type === 'note') { document.getElementById('edit-content').value = item.content || ""; }
            refreshFileList(item);
            document.getElementById('editor-modal').style.display = 'block';
            updateLiveStyle();
        }

        async function processSave() {
            const name = document.getElementById('edit-name').value || "Névtelen";
            const now = new Date();
            const dateStr = now.toLocaleDateString('hu-HU') + " " + now.toLocaleTimeString('hu-HU', {hour:'2-digit', minute:'2-digit'});
            
            if (editingItemId) {
                let item = findNode(editingItemId, vault);
                item.name = name; item.color = document.getElementById('edit-color').value;
                item.fontFamily = document.getElementById('edit-font-family').value;
                item.fontSize = document.getElementById('edit-font-size').value;
                item.displaySize = document.getElementById('edit-card-size').value;
                item.date = dateStr;
                if(item.type === 'note') {
                    item.content = document.getElementById('edit-content').value;
                    const fIn = document.getElementById('edit-file');
                    for (let f of fIn.files) {
                        if(!item.files) item.files = [];
                        item.files.push({id: "f_"+Date.now()+"_"+Math.random(), name: f.name, data: await toB64(f), type: f.type});
                    }
                }
            } else {
                const parent = findNode(currentId, vault);
                let newItem = { 
                    id: "id_"+Date.now(), name, type: window.modalMode, 
                    color: document.getElementById('edit-color').value, 
                    fontFamily: document.getElementById('edit-font-family').value, 
                    fontSize: document.getElementById('edit-font-size').value,
                    displaySize: document.getElementById('edit-card-size').value,
                    timestamp: Date.now(), date: dateStr 
                };
                if (window.modalMode === 'folder') { newItem.children = []; }
                else {
                    newItem.content = document.getElementById('edit-content').value; newItem.files = [];
                    const fIn = document.getElementById('edit-file');
                    for (let f of fIn.files) newItem.files.push({id: "f_"+Date.now()+"_"+Math.random(), name: f.name, data: await toB64(f), type: f.type});
                }
                parent.children.push(newItem);
            }
            saveToDB(() => { closeModal(); render(); });
        }

        // VISSZAÁLLÍTOTT FUNKCIÓ: Felugró ablak a fájlnévhez
        function exportData() {
            const n = new Date();
            const d = `${n.getFullYear()}-${n.getMonth()+1}-${n.getDate()}_${n.getHours()}-${n.getMinutes()}`;
            const defaultName = `NeoVault_Mentes_${d}`;
            let customName = prompt("Add meg a mentés nevét (a .json automatikus):", defaultName);
            if (customName === null) return;
            const finalName = (customName || defaultName) + ".json";
            const blob = new Blob([JSON.stringify(vault)], {type:"application/json"});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = finalName;
            a.click();
            URL.revokeObjectURL(a.href);
        }

        function importData(e) {
            const r = new FileReader();
            r.onload = ev => {
                try {
                    vault = JSON.parse(ev.target.result);
                    saveToDB(() => { alert("Import sikeres!"); render(); });
                } catch(h) { alert("Hiba a fájlban!"); }
            };
            r.readAsText(e.target.files[0]);
        }

        function refreshFileList(item) {
            let zone = document.getElementById('file-download-zone');
            zone.innerHTML = "";
            if(!item || !item.files) return;
            item.files.forEach((f) => {
                const div = document.createElement('div');
                div.className = "file-item";
                let preview = (f.type && f.type.startsWith('image/')) ? `<img src="${f.data}" class="preview-img" onclick="openCinema('${f.data}')">` : `<span>📄</span>`;
                div.innerHTML = `
                    <div style="display:flex; align-items:center; gap:10px;">${preview}<span style="max-width:150px; overflow:hidden;">${f.name}</span></div>
                    <div class="file-controls">
                        <button onclick="downloadFile('${f.data}', '${f.name}')" style="border-color:var(--neon-blue-ui); color:var(--neon-blue-ui);">⬇</button>
                        <button onclick="removeFile('${item.id}', '${f.id}')" style="border-color:var(--neon-red); color:var(--neon-red);">✖</button>
                    </div>`;
                zone.appendChild(div);
            });
        }

        function openCinema(src) {
            const overlay = document.getElementById('cinema-overlay');
            const img = document.getElementById('cinema-img');
            img.src = src;
            overlay.style.display = 'flex';
        }

        function downloadFile(data, name) { const a = document.createElement('a'); a.href = data; a.download = name; a.click(); }

        function removeFile(itemId, fileId) {
            if(!confirm("Biztosan törlöd a fájlt?")) return;
            const item = findNode(itemId, vault);
            item.files = item.files.filter(f => f.id !== fileId);
            saveToDB(() => {
                refreshFileList(item);
                render();
            });
        }

        function copyToClipboard() {
            const txt = document.getElementById('edit-content').value;
            navigator.clipboard.writeText(txt).then(() => alert("Szöveg a vágólapra másolva!"));
        }

        function findNode(id, node) { if (node.id === id) return node; if (node.children) { for (let c of node.children) { let f = findNode(id, c); if (f) return f; } } return null; }
        
        function goBack() { if (pathStack.length > 1) { pathStack.pop(); currentId = pathStack[pathStack.length-1]; document.getElementById('search-input').value = ""; render(); } }

        function updateMB() { const size = new Blob([JSON.stringify(vault)]).size / (1024*1024); document.getElementById('storage-bar').style.width = Math.min(100, (size/500)*100) + "%"; document.getElementById('storage-text').innerText = size.toFixed(2) + " / 500 MB"; }
        
        function closeModal() { document.getElementById('editor-modal').style.display = 'none'; }
        
        const toB64 = f => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(f); });
        
        function updateLiveStyle() {
            const f = document.getElementById('edit-font-family').value;
            document.getElementById('edit-name').style.fontFamily = f;
            if(document.getElementById('edit-content')) document.getElementById('edit-content').style.fontFamily = f;
        }

        function deleteItem(e, id) { 
            e.stopPropagation(); 
            if(confirm("Biztosan törlöd?")) { 
                const del = (n) => { 
                    if(n.children) { 
                        const idx = n.children.findIndex(c => c.id === id); 
                        if(idx > -1) { n.children.splice(idx,1); return true; } 
                        for(let c of n.children) if(del(c)) return true; 
                    } 
                    return false; 
                }; 
                del(vault); saveToDB(render); 
            } 
        }
    </script>
