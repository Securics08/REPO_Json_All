<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>1 · Szín — SECURICS</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600;700&family=Geist+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --hh:88px;
  --bg:#050609;
  --text:#F4F6FB;
  --text2:#C9CFDD;
  --a:#B6FF5A;   /* felhasználó által állítható kiemelő szín */
  --a2:#8CF03A;  /* automatikusan számolt, kicsit sötétebb árnyalat */
  --glass-bg:linear-gradient(135deg,rgba(255,255,255,.09) 0%,rgba(255,255,255,.03) 55%,rgba(255,255,255,.06) 100%);
  --glass-border:rgba(255,255,255,.16);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg);color:var(--text);overflow:hidden;
  font-family:'Geist','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}

#head{position:fixed;top:0;left:0;right:0;z-index:9999;padding:12px 14px 10px;
  background:linear-gradient(180deg,#050609 0%,#020203 100%)}
#aurora{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:24px}
#aurora i{position:absolute;border-radius:50%;filter:blur(38px);opacity:.85;will-change:transform;background:var(--a)}
#aurora i:nth-child(1){width:340px;height:120px;left:4%;top:-30px;opacity:.28;animation:d1 16s ease-in-out infinite alternate}
#aurora i:nth-child(2){width:420px;height:130px;left:34%;top:20px;opacity:.16;animation:d2 20s ease-in-out infinite alternate}
#aurora i:nth-child(3){width:380px;height:120px;right:14%;top:-24px;opacity:.24;animation:d3 18s ease-in-out infinite alternate}
@keyframes d1{to{transform:translateX(120px) translateY(14px)}}
@keyframes d2{to{transform:translateX(-160px) translateY(-10px)}}
@keyframes d3{to{transform:translateX(-100px) translateY(18px)}}
@media (prefers-reduced-motion:reduce){#aurora i{animation:none}}

#top{position:relative;display:flex;align-items:center;gap:16px;
  padding:14px 16px 14px 20px;border-radius:24px;
  background:var(--glass-bg);
  -webkit-backdrop-filter:blur(26px) saturate(160%);backdrop-filter:blur(26px) saturate(160%);
  border:1px solid var(--glass-border);
  box-shadow:0 1px 0 rgba(255,255,255,.22) inset,0 -1px 0 rgba(255,255,255,.04) inset,
             0 18px 50px rgba(0,0,0,.65),0 2px 10px rgba(0,0,0,.5)}
#top::before{content:"";position:absolute;left:18px;right:18px;top:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);opacity:.7;pointer-events:none}

.brand{display:flex;align-items:center;gap:12px;flex:0 0 auto;padding-right:16px;
  border-right:1px solid rgba(255,255,255,.18);user-select:none;min-width:0}
.brand-dot{flex:0 0 auto;width:13px;height:13px;border-radius:50%;background:var(--a);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 22%,transparent),0 0 14px var(--a),0 0 28px color-mix(in srgb,var(--a) 70%,transparent);
  transition:background .2s,box-shadow .2s}
.brand-txt{min-width:0}
.brand-text{font-family:'Geist Mono',ui-monospace,monospace;font-size:15px;font-weight:700;letter-spacing:.14em;color:#fff;line-height:1;
  text-shadow:0 1px 8px rgba(0,0,0,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.05em;color:var(--text2);font-weight:500;margin-top:5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{cursor:text}
.brand-sub-in{font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.05em;font-weight:500;color:#fff;background:rgba(255,255,255,.12);border:1px solid var(--a,#B6FF5A);border-radius:6px;padding:1px 6px;outline:none;width:6ch;min-width:6ch;box-sizing:content-box}


.spacer{flex:1 1 auto;min-width:8px}

/* ===== szín választó ===== */
.colorpick{position:relative;flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:8px 14px 8px 10px;border-radius:16px;border:1px solid rgba(255,255,255,.2);
  background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.04));
  box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 4px 14px rgba(0,0,0,.3)}
.swatch{position:relative;width:34px;height:34px;border-radius:50%;flex:0 0 auto;cursor:pointer;
  border:2px solid rgba(255,255,255,.55);background:var(--a);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 28%,transparent),0 0 16px color-mix(in srgb,var(--a) 60%,transparent)}
.swatch input[type=color]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.colorpick .lbl2{display:flex;flex-direction:column;line-height:1.2}
.colorpick .lbl2 b{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--text2);text-transform:uppercase}
.colorpick .lbl2 span{font-family:'Geist Mono',ui-monospace,monospace;font-size:12.5px;font-weight:600;color:#fff}
.presets{display:flex;gap:6px;margin-left:2px}
.presets button{width:20px;height:20px;border-radius:50%;border:1px solid rgba(255,255,255,.4);cursor:pointer;padding:0;transition:transform .15s}
.presets button:hover{transform:scale(1.18)}

/* ===== eszközgombok ===== */
.tools{display:flex;gap:8px;flex:0 0 auto}
.tools button{width:54px;height:54px;border-radius:17px;cursor:pointer;font-size:21px;color:var(--text);
  background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.2);
  box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 4px 14px rgba(0,0,0,.35);transition:.18s}
.tools button:hover{transform:translateY(-2px);border-color:var(--a);
  box-shadow:0 0 18px color-mix(in srgb,var(--a) 55%,transparent),0 1px 0 rgba(255,255,255,.3) inset}

#stage{position:absolute;left:0;right:0;bottom:0;top:var(--hh);background:#000}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}

#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(20px);z-index:10000;
  background:rgba(20,22,28,.78);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.22);color:var(--text);font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;
  padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:all .35s}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:900px){
  #head{padding:8px 8px 6px}
  #top{gap:10px;padding:10px 12px;border-radius:20px;flex-wrap:wrap}
  .tools{display:none}
  .brand-sub{display:none}
  .presets{display:none}
  .brand{padding-right:10px}
}
@media (max-width:560px){
  .colorpick .lbl2{display:none}
  .colorpick{padding:6px 8px}
}
</style>
</head>

  <div id="aurora"><i></i><i></i><i></i></div>
  <div id="top">
    <div class="brand">

      <div class="brand-txt"><div class="brand-text">SECURICS</div><div class="brand-sub" id="brandSub" title="Dupla kattintás: átnevezés">Neon Repo 03 – Színkalkulátor (8 szín)</div></div>
    </div>
    <div class="spacer"></div>
    <div class="colorpick" title="Kiemelő szín beállítása">
      <div class="swatch" id="swatchWrap"><input type="color" id="accentPicker" value="#B6FF5A"></div>
      <div class="lbl2"><b>Szín</b><span id="accentHex">#B6FF5A</span></div>
      <div class="presets" id="presets"></div>
    </div>
    <div class="tools">
      <button id="btnReload" title="Eszköz újratöltése">⟳</button>
      <button id="btnFull" title="Teljes képernyő">⛶</button>
    </div>
  </div>
</div>

function b64ToUtf8(s){ var bin=atob(s), len=bin.length, u=new Uint8Array(len); for(var i=0;i<len;i++) u[i]=bin.charCodeAt(i); return new TextDecoder('utf-8').decode(u); }
document.getElementById('toolFrame').srcdoc = b64ToUtf8(TOOL_B64);

var toastEl=document.getElementById('toast');
function toast(msg){ toastEl.textContent=msg; toastEl.classList.add('show'); clearTimeout(toastEl._t); toastEl._t=setTimeout(function(){ toastEl.classList.remove('show'); },2000); }

function sync(){ var h=document.getElementById('head').offsetHeight; document.documentElement.style.setProperty('--hh',h+'px'); }
window.addEventListener('resize',sync);
if(window.ResizeObserver) new ResizeObserver(sync).observe(document.getElementById('head'));
sync();

document.getElementById('btnReload').addEventListener('click', function(){
  if(confirm('Újratöltöd az eszközt? A nem mentett munka elveszhet.')){
    document.getElementById('toolFrame').srcdoc = b64ToUtf8(TOOL_B64);
    toast('Újratöltve');
  }
});
document.getElementById('btnFull').addEventListener('click', function(){
  var d=document.documentElement;
  if(!document.fullscreenElement){ (d.requestFullscreen||function(){}).call(d); } else { document.exitFullscreen(); }
});

/* ===== kiemelő szín kezelése ===== */
var LS_KEY='securics_header_accent_1';
var NAME_KEY='securics_header_name_1';
function loadName(def){ try{ var v=localStorage.getItem(NAME_KEY); return (v&&v.trim())?v:def; }catch(e){ return def; } }
function startRenameSub(){
  var el=document.getElementById('brandSub'); if(!el||el.querySelector('input'))return;
  var cur=el.textContent, inp=document.createElement('input');
  inp.type='text'; inp.className='brand-sub-in'; inp.value=cur; inp.maxLength=80;
  function autosize(){ inp.style.width=Math.max(4,inp.value.length+1)+'ch'; }
  inp.addEventListener('input',autosize);
  el.textContent=''; el.appendChild(inp); autosize(); inp.focus(); inp.select();
  function commit(save){ var v=inp.value.trim()||cur; el.textContent=v; if(save){ try{ localStorage.setItem(NAME_KEY, v); }catch(e){} } }
  inp.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); commit(true); } else if(e.key==='Escape'){ e.preventDefault(); el.textContent=cur; } });
  inp.addEventListener('blur',function(){ commit(true); });
  inp.addEventListener('click',function(e){ e.stopPropagation(); });
  inp.addEventListener('dblclick',function(e){ e.stopPropagation(); });
}
document.getElementById('brandSub').addEventListener('dblclick',function(e){ e.preventDefault(); startRenameSub(); });
document.getElementById('brandSub').textContent = loadName(document.getElementById('brandSub').textContent);

function shade(hex, amt){
  hex=hex.replace('#','');
  var r=parseInt(hex.substring(0,2),16), g=parseInt(hex.substring(2,4),16), b=parseInt(hex.substring(4,6),16);
  r=Math.max(0,Math.min(255,Math.round(r*(1+amt)))); g=Math.max(0,Math.min(255,Math.round(g*(1+amt)))); b=Math.max(0,Math.min(255,Math.round(b*(1+amt))));
  return '#'+[r,g,b].map(function(v){ return v.toString(16).padStart(2,'0'); }).join('');
}
function applyAccent(hex, save){
  document.documentElement.style.setProperty('--a', hex);
  document.documentElement.style.setProperty('--a2', shade(hex,-0.22));
  document.getElementById('accentPicker').value = hex;
  document.getElementById('accentHex').textContent = hex.toUpperCase();
  if(save){ try{ localStorage.setItem(LS_KEY, hex); }catch(e){} }
}
document.getElementById('accentPicker').addEventListener('input', function(){ applyAccent(this.value, true); });
var PRESETS = ['#FF0000','#FFFF00','#0000FF','#00FF00','#FF8800','#00FFFF','#FF00FF','#FFFFFF','#000000'];
var presetsEl = document.getElementById('presets');
PRESETS.forEach(function(c){
  var b=document.createElement('button'); b.style.background=c; b.title=c;
  b.addEventListener('click', function(){ applyAccent(c, true); toast('Szín: '+c); });
  presetsEl.appendChild(b);
});
(function(){
  var saved=null; try{ saved=localStorage.getItem(LS_KEY); }catch(e){}
  applyAccent(saved || '#B6FF5A', false);
})();
</script>
