<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
body{margin:0;background:#050505;color:#fff;font-family:Segoe UI,sans-serif;display:flex;height:100vh;overflow:hidden}
.sidebar{width:380px;background:#0a0a0a;border-right:2px solid #222;display:flex;flex-direction:column;padding:14px}
.main{flex:1;display:flex;flex-direction:column;background:#000;overflow:hidden}
h2{color:#ffea00;text-shadow:0 0 10px #ffea00;font-size:18px;margin:0 0 10px 0;text-align:center}
.storage{font-size:11px;color:#ffea00;font-weight:bold;margin-bottom:4px}
.bar{width:100%;height:8px;background:#111;border-radius:5px;overflow:hidden;margin-bottom:10px;border:1px solid #333}
#fill{height:100%;width:0%;background:linear-gradient(90deg,#ffea00,#fff);box-shadow:0 0 6px #ffea00;transition:0.5s}
input,textarea,button{background:#161616;color:#fff;border:1px solid #333;padding:10px;border-radius:8px;outline:none;margin-bottom:6px;font-size:13px}
textarea{flex:1;width:100%;resize:none;font-family:Consolas,monospace;color:#0f0;font-size:13px;background:#000;border:1px solid #0f04;line-height:1.5}
.toolbar{display:flex;gap:6px;margin-bottom:6px}
button{cursor:pointer;font-weight:bold;font-size:11px;flex:1;border:1px solid transparent;transition:0.2s;text-transform:uppercase;padding:11px;border-radius:8px}
button:hover{filter:brightness(1.2)}
.btn-save{background:#ffea00;color:#000;box-shadow:0 0 10px #ffea00aa}
.btn-new{background:#222;color:#fff;border:1px solid #444}
.btn-del{background:#aa0000;border:1px solid #ff4444;color:#fff}
.btn-imp{background:#ff8800;border:1px solid #ffaa00;color:#000}
.btn-exp{background:#8800ff;border:1px solid #aa00ff;color:#fff}
.btn-edge{background:#440000 !important;border:1px solid #880000 !important;color:#ffaaaa !important;}
.btn-reset{background:#660000 !important;border:1px solid #ff0000 !important;color:#fff !important;}
#fileList{flex:1;overflow-y:auto;padding-right:4px;margin-top:8px}
.file-item{padding:10px;margin-bottom:8px;background:#141414;border-radius:8px;cursor:pointer;border:1px solid #222;border-left:5px solid #ffea00}
.file-item.active{background:#222;border-color:#ffea00aa}
.file-item strong{display:block;font-size:13px;margin-bottom:3px}
.file-item small{color:#888;font-size:10px;font-family:monospace}
.editor-sec{display:flex;flex-direction:column;padding:8px;border-bottom:2px solid #333;background:#000;overflow:hidden;height:45%;min-height:100px}
#resizer{height:12px;background:#1a1a1a;cursor:row-resize;display:flex;align-items:center;justify-content:center;border-top:2px solid #333;border-bottom:2px solid #333;flex-shrink:0}
#resizer:hover{background:#333}
#resizer::after{content:"═══ HÚZD AZ ÁTMÉRETEZÉSHEZ ═══"; color:#666; font-size:9px; letter-spacing:1px}
.preview-sec{flex:1;display:flex;flex-direction:column;background:#fff;overflow:hidden;min-height:100px}
.preview-head{background:#0a0a0a;color:#0f0;padding:6px 12px;font-size:11px;font-weight:bold;border-bottom:1px solid #333;display:flex;justify-content:space-between}
iframe.preview{flex:1;border:none;background:#fff;width:100%}
.bottom-block{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:8px;border-top:1px solid #222}
</style></head><body>
<div class="sidebar">
<h2>⚡ V10 - MŰKÖDŐ + HÚZHATÓ</h2>
<div class="storage">TÁRHELY: <span id="stTxt">0 MB</span> | <span id="status" style="color:#0f0">OK</span></div><div class="bar"><div id="fill"></div></div>
<input type="text" id="fileName" placeholder="Projekt neve...">
<div id="fileList"></div>
<div class="bottom-block">
<div class="toolbar"><button class="btn-save" onclick="saveToDB()">MENTÉS + JSON</button><button class="btn-new" onclick="newProj()">ÚJ</button><button class="btn-del" onclick="deleteFromDB()">TÖRÖL</button></div>
<div class="toolbar"><button class="btn-imp" onclick="importData()">IMPORT</button><button class="btn-exp" onclick="exportData()">EXPORT</button></div>
<div class="toolbar"><button class="btn-edge" onclick="clearEdge()">🧹 EDGE TAKARÍTÁS</button><button class="btn-reset" onclick="clearAll()">RENDSZER RESET</button></div>
</div>
</div>
<div class="main">
<div class="editor-sec" id="editorSec"><div class="toolbar"><span style="color:#ffff00;font-size:11px;padding-top:8px;font-weight:bold">KÓD</span><button style="background:#0088ff" onclick="copyCode()">MÁSOLÁS</button><button style="background:#0f0;color:#000;flex:2" onclick="runCode()">▶ FUTTATÁS</button></div>
<textarea id="editor" spellcheck="false" placeholder="Ide írd a HTML kódot..."></textarea></div>
<div id="resizer"></div>
<div class="preview-sec" id="previewSec"><div class="preview-head"><span>ELŐNÉZET - HÚZD FELÜL A CSÍKOT!</span><span style="color:#888">↕</span></div><iframe id="preview" class="preview"></iframe></div>
</div>
<script>
let db=null; let activeId=null;
const STORE="projects";
const DB_NAME="NeonRepoV10_FINAL";
const neonColors=["#ffea00","#00f6ff","#ff00ff","#00ff88","#ff8800"];

function setStatus(t){document.getElementById('status').textContent=t;}

function initDB(){
  const req=indexedDB.open(DB_NAME,1);
  req.onupgradeneeded=e=>{const d=e.target.result; if(!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE,{keyPath:"id",autoIncrement:true});};
  req.onsuccess=e=>{db=e.target.result; setStatus("DB OK"); loadList();};
  req.onerror=e=>{setStatus("DB HIBA: "+e.target.error); alert("DB hiba: Edge-ben engedélyezd a fájl hozzáférést!");};
}

function downloadFile(content,fileName){
  const blob=new Blob([content],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=fileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

function saveToDB(){
  if(!db){alert("DB még nem nyílt meg, várj 1 mp!"); return;}
  const name=document.getElementById("fileName").value.trim() || "NeonRepo_"+Date.now();
  const code=document.getElementById("editor").value;
  if(!code.trim()){alert("Üres a kód! Írj valamit!"); return;}
  const color=neonColors[Math.floor(Math.random()*neonColors.length)];
  const tx=db.transaction(STORE,"readwrite");
  const store=tx.objectStore(STORE);
  const data={name,code,color,time:new Date().toLocaleString("hu-HU")};
  if(activeId) data.id=activeId;
  const req=store.put(data);
  req.onsuccess=e=>{
    activeId=activeId||e.target.result;
    loadList();
    const now=new Date(); const pad=n=>String(n).padStart(2,'0');
    const d=now.getFullYear()+"-"+pad(now.getMonth()+1)+"-"+pad(now.getDate());
    const t=pad(now.getHours())+"-"+pad(now.getMinutes())+"-"+pad(now.getSeconds());
    const fname=name.replace(/\s+/g,'_')+"_"+d+"_"+t+".json";
    downloadFile(JSON.stringify(data,null,2), fname);
    setStatus("MENTVE: "+name);
  };
  req.onerror=()=>{alert("Mentés hiba!");};
}

function loadList(){
  if(!db) return;
  const tx=db.transaction(STORE,"readonly");
  const store=tx.objectStore(STORE);
  const req=store.getAll();
  req.onsuccess=e=>{
    const list=document.getElementById("fileList");
    list.innerHTML="";
    let size=0;
    const items=e.target.result;
    items.forEach(item=>{
      size+=new Blob([item.code]).size;
      const div=document.createElement("div");
      div.className="file-item"+(activeId===item.id?" active":"");
      div.style.borderLeftColor=item.color;
      div.innerHTML="<strong style='color:"+item.color+"'>"+item.name+"</strong><small>"+item.time+"</small>";
      div.onclick=()=>{
        activeId=item.id;
        document.getElementById("fileName").value=item.name;
        document.getElementById("editor").value=item.code;
        loadList();
        runCode();
      };
      list.appendChild(div);
    });
    const mb=(size/(1024*1024)).toFixed(2);
    document.getElementById("stTxt").textContent=mb+" MB / 500 MB";
    document.getElementById("fill").style.width=Math.min((size/(500*1024*1024))*100,100)+"%";
    try{parent.postMessage({type:"count", module:0, count:items.length},"*");}catch(ex){}
  };
}

function runCode(){
  const code=document.getElementById("editor").value;
  if(!code.trim()){alert("Nincs kód!"); return;}
  const blob=new Blob([code],{type:'text/html'});
  const url=URL.createObjectURL(blob);
  document.getElementById("preview").src=url;
}

function newProj(){
  activeId=null;
  document.getElementById("fileName").value="";
  document.getElementById("editor").value="";
  document.getElementById("preview").src="about:blank";
  loadList();
  setStatus("ÚJ projekt");
}

function deleteFromDB(){
  if(!activeId){alert("Válassz ki egy projektet a listából!"); return;}
  if(!confirm("Törlöd?")) return;
  const tx=db.transaction(STORE,"readwrite");
  tx.objectStore(STORE).delete(activeId).onsuccess=()=>{
    newProj();
    setStatus("TÖRÖLVE");
  };
}

function exportData(){
  if(!db){alert("DB nem nyílt"); return;}
  const now=new Date(); const pad=n=>String(n).padStart(2,'0');
  const dateStr=now.getFullYear()+"-"+pad(now.getMonth()+1)+"-"+pad(now.getDate());
  const timeStr=pad(now.getHours())+":"+pad(now.getMinutes())+":"+pad(now.getSeconds());
  const timeFile=pad(now.getHours())+"-"+pad(now.getMinutes())+"-"+pad(now.getSeconds());
  const baseName=document.getElementById("fileName").value.trim()||"NeonRepo_Export";
  const defName=baseName.replace(/\s+/g,'_')+"_"+dateStr+"_"+timeFile;
  let name=prompt("Export fájl neve (név_dátum_idő):", defName);
  if(!name) return;
  if(!name.endsWith(".json")) name+=".json";
  const tx=db.transaction(STORE,"readonly");
  tx.objectStore(STORE).getAll().onsuccess=e=>{
    const data=e.target.result;
    if(!data.length){alert("Nincs mentett adat!"); return;}
    const exportObj={
      exportName:name,
      exportDate:dateStr,
      exportTime:timeStr,
      exportDateTime:now.toLocaleString("hu-HU"),
      count:data.length,
      data:data
    };
    downloadFile(JSON.stringify(exportObj,null,2), name);
    setStatus("EXPORT: "+name);
  };
}

function importData(){
  const input=document.createElement("input");
  input.type="file";
  input.accept=".json";
  input.onchange=e=>{
    const file=e.target.files[0];
    if(!file) return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const parsed=JSON.parse(ev.target.result);
        let arr=parsed.data||parsed;
        if(!Array.isArray(arr)) arr=[arr];
        const tx=db.transaction(STORE,"readwrite");
        const store=tx.objectStore(STORE);
        arr.forEach(it=>{delete it.id; store.put(it);});
        tx.oncomplete=()=>{
          loadList();
          alert("Import kész: "+arr.length+" db");
          setStatus("IMPORT: "+arr.length);
        };
      }catch(err){alert("Import hiba: "+err.message);}
    };
    reader.readAsText(file);
  };
  input.click();
}

function clearEdge(){
  if(!confirm("EDGE takarítás - törlöd a listát?")) return;
  clearAll();
}

function clearAll(){
  if(!confirm("MINDEN TÖRLŐDIK! Biztos?")) return;
  const tx=db.transaction(STORE,"readwrite");
  tx.objectStore(STORE).clear().onsuccess=()=>{
    newProj();
    setStatus("RESET kész");
  };
}

function copyCode(){
  const ed=document.getElementById("editor");
  ed.select();
  document.execCommand("copy");
  setStatus("MÁSOLVA!");
  setTimeout(()=>setStatus("DB OK"),1500);
}

// Resizer - húzható előnézet
(function(){
  const resizer=document.getElementById('resizer');
  const editorSec=document.getElementById('editorSec');
  const previewSec=document.getElementById('previewSec');
  let dragging=false;
  let startY=0;
  let startEditorH=0;

  resizer.addEventListener('mousedown', (e)=>{
    dragging=true;
    startY=e.clientY;
    startEditorH=editorSec.offsetHeight;
    document.body.style.cursor='row-resize';
    document.body.style.userSelect='none';
    e.preventDefault();
  });

  document.addEventListener('mousemove', (e)=>{
    if(!dragging) return;
    const dy=e.clientY - startY;
    let newH=startEditorH + dy;
    const total=document.querySelector('.main').offsetHeight;
    if(newH < 80) newH=80;
    if(newH > total - 80) newH=total-80;
    editorSec.style.height=newH+'px';
    editorSec.style.flex='none';
    previewSec.style.flex='1';
  });

  document.addEventListener('mouseup', ()=>{
    if(dragging){
      dragging=false;
      document.body.style.cursor='';
      document.body.style.userSelect='';
    }
  });
})();

// Init
initDB();
</script></body></html>
