<script>
let projects=[];
let currentId=null;
let currentColor='#00ff00';
let exportMode='all';
const DB_NAME='neonRepoDB_final_fixed';
const LS_KEY='neon_final_projects';
const LS_CUR='neon_final_cur';
const LS_COL='neon_final_col';

function normalize(o){
  if(!o || typeof o!=='object') return null;
  let bestCode='';
  let keys=['code','html','content','source','data','body','htmlContent','value','text','fileContent'];
  for(let k of keys){
    if(typeof o[k]==='string' && o[k].length>bestCode.length) bestCode=o[k];
  }
  if(!bestCode){
    for(let k in o){
      let v=o[k];
      if(typeof v==='string' && v.length>bestCode.length) bestCode=v;
    }
  }
  let bestName='';
  let nKeys=['name','title','filename','fileName','projectName','label'];
  for(let k of nKeys){
    if(typeof o[k]==='string' && o[k].length>0 && o[k].length<300){ bestName=o[k]; break; }
  }
  if(!bestName) bestName='Projekt_'+Date.now();
  if(!bestCode) return null;
  return {id:Date.now()+Math.floor(Math.random()*999999),name:bestName,code:bestCode,color:o.color||currentColor||'#00ff00',charCount:bestCode.length};
}

function parseUniversal(text){
  if(!text) return [];
  let clean=text.trim();
  let results=[];
  try{
    let j=JSON.parse(clean);
    if(Array.isArray(j)){
      j.forEach(function(item){ let n=normalize(item); if(n) results.push(n); });
      if(results.length>0) return results;
    }
    let keys=['projects','data','items','codes','files','list','entries'];
    for(let ck of keys){
      if(j[ck] && Array.isArray(j[ck])){
        j[ck].forEach(function(item){ let n=normalize(item); if(n) results.push(n); });
        if(results.length>0) return results;
      }
    }
    let single=normalize(j);
    if(single) return [single];
  }catch(e){}
  try{
    let t=clean;
    if(t.startsWith('[') && t.endsWith(']')) t=t.slice(1,-1);
    let parts=[];
    let depth=0;
    let inStr=false;
    let esc=false;
    let start=0;
    for(let i=0;i<t.length;i++){
      let ch=t[i];
      if(esc){ esc=false; continue; }
      if(ch==='\\'){ esc=true; continue; }
      if(ch==='"'){ inStr=!inStr; continue; }
      if(inStr) continue;
      if(ch==='{') depth++;
      if(ch==='}'){ depth--; if(depth===0){ let part=t.slice(start,i+1).trim(); if(part.startsWith(',')) part=part.slice(1); parts.push(part); start=i+1; } }
    }
    parts.forEach(function(p){
      try{ let obj=JSON.parse(p); let n=normalize(obj); if(n) results.push(n); }catch(e){}
    });
    if(results.length>0) return results;
  }catch(e){}
  return results;
}

function saveLS(){
  try{
    let idx=projects.map(function(p){ return {id:p.id,name:p.name,color:p.color,charCount:p.charCount}; });
    localStorage.setItem(LS_KEY+'_index', JSON.stringify(idx));
    if(currentId) localStorage.setItem(LS_CUR, currentId);
    localStorage.setItem(LS_COL, currentColor);
    try{ localStorage.setItem(LS_KEY, JSON.stringify(projects)); }catch(q){ localStorage.removeItem(LS_KEY); }
  }catch(e){}
}

function loadLS(){
  try{
    let p=localStorage.getItem(LS_KEY);
    if(p) projects=JSON.parse(p);
    let c=localStorage.getItem(LS_CUR);
    if(c) currentId=c;
    let col=localStorage.getItem(LS_COL);
    if(col) currentColor=col;
  }catch(e){}
}

function saveDB(){
  let req=indexedDB.open(DB_NAME,1);
  req.onupgradeneeded=function(e){ let db=e.target.result; if(!db.objectStoreNames.contains('projects')) db.createObjectStore('projects',{keyPath:'id'}); };
  req.onsuccess=function(e){ let db=e.target.result; let tx=db.transaction('projects','readwrite'); let st=tx.objectStore('projects'); st.clear(); projects.forEach(function(pr){ st.put(pr); }); };
}

function loadDB(){
  let req=indexedDB.open(DB_NAME,1);
  req.onupgradeneeded=function(e){ let db=e.target.result; if(!db.objectStoreNames.contains('projects')) db.createObjectStore('projects',{keyPath:'id'}); };
  req.onsuccess=function(e){
    let db=e.target.result;
    let tx=db.transaction('projects','readonly');
    let st=tx.objectStore('projects');
    let ga=st.getAll();
    ga.onsuccess=function(){
      if(ga.result && ga.result.length>0){ projects=ga.result; render(); if(!currentId && projects.length>0) selectProject(projects[0].id); }
    };
  };
}

function render(){
  let list=document.getElementById('projectList');
  let count=document.getElementById('countText');
  let storage=document.getElementById('storageText');
  let bar=document.getElementById('progressBar');
  let totalChar=0;
  projects.forEach(function(p){ totalChar+= (p.charCount||0); });
  let totalMB=(totalChar/1024/1024).toFixed(2);
  storage.textContent='TÁRHELY: '+totalMB+' MB / 500 MB';
  bar.style.width=Math.min((parseFloat(totalMB)/500*100),100)+'%';
  count.textContent=projects.length+' db • '+totalChar+' char';
  if(projects.length===0){ list.innerHTML='<div class="empty-msg">Nincs projekt - RESET után üres</div>'; return; }
  list.innerHTML='';
  projects.forEach(function(p,i){
    let d=document.createElement('div');
    d.className='proj-card'+(p.id==currentId?' active':'');
    d.onclick=function(){ selectProject(p.id); };
    d.innerHTML='<div class="proj-name" style="color:'+p.color+'">'+(i+1)+'. '+p.name+'</div><div class="proj-meta">'+(p.charCount||0)+' char • '+p.color+'</div>';
    list.appendChild(d);
  });
}

function selectProject(id){
  let p=projects.find(function(x){ return x.id==id; });
  if(!p) return;
  currentId=id;
  document.getElementById('projectName').value=p.name;
  document.getElementById('codeEditor').value=p.code;
  currentColor=p.color||'#00ff00';
  document.querySelectorAll('.color-dot').forEach(function(d){ d.classList.toggle('active', d.dataset.color===currentColor); });
  render();
  runCode();
  saveLS();
  saveDB();
}

function setColor(col,el){
  currentColor=col;
  document.querySelectorAll('.color-dot').forEach(function(d){ d.classList.remove('active'); });
  if(el) el.classList.add('active');
  if(currentId){
    let pr=projects.find(function(x){ return x.id==currentId; });
    if(pr){ pr.color=col; render(); saveLS(); saveDB(); }
  }
}

function saveCurrent(){
  let nameEl=document.getElementById('projectName');
  let codeEl=document.getElementById('codeEditor');
  let name=nameEl.value.trim()|| ((projects.length+1)+'. Projekt');
  let code=codeEl.value;
  if(!code.trim()){ alert('Üres kód!'); return; }
  if(currentId){
    let pr=projects.find(function(x){ return x.id==currentId; });
    if(pr){ pr.name=name; pr.code=code; pr.color=currentColor; pr.charCount=code.length; }
  } else {
    let np={id:Date.now(),name:name,code:code,color:currentColor,charCount:code.length};
    projects.push(np);
    currentId=np.id;
  }
  saveLS();
  saveDB();
  render();
}

function newProject(){
  currentId=null;
  let next=projects.length+1;
  let el=document.getElementById('projectName');
  el.placeholder=next+'. Projekt neve...';
  el.value='';
  document.getElementById('codeEditor').value='';
  document.getElementById('previewFrame').srcdoc='';
  render();
}

function deleteProject(){
  if(!currentId){ alert('Nincs kiválasztva'); return; }
  if(!confirm('Törlöd?')) return;
  projects=projects.filter(function(p){ return p.id!=currentId; });
  currentId=null;
  document.getElementById('projectName').value='';
  document.getElementById('codeEditor').value='';
  document.getElementById('previewFrame').srcdoc='';
  saveLS();
  saveDB();
  render();
}

function saveAndExport(){
  saveCurrent();
  if(!currentId){ alert('Nincs kiválasztva'); return; }
  exportMode='single';
  let p=projects.find(function(x){ return x.id==currentId; });
  if(!p) return;
  let now=new Date();
  let pad=function(n){ return String(n).padStart(2,'0'); };
  let fname=(p.name||'projekt').replace(/[^a-zA-Z0-9_ -]/g,'').slice(0,40)+'_'+now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate());
  document.getElementById('exportFileName').value=fname;
  document.getElementById('exportInfo').innerHTML='Fájl: '+fname+'.json<br>Tartalom: 1 projekt • '+(p.charCount||0)+' char (csak ez)';
  document.getElementById('exportModal').classList.add('show');
}

function exportAllJson(){
  if(projects.length===0){ alert('Nincs mit exportálni'); return; }
  exportMode='all';
  let now=new Date();
  let pad=function(n){ return String(n).padStart(2,'0'); };
  let fname='Html_adatbazis_Export_'+now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate())+'_'+pad(now.getHours())+'-'+pad(now.getMinutes())+'-'+pad(now.getSeconds());
  document.getElementById('exportFileName').value=fname;
  let totalChar=projects.reduce(function(a,b){ return a+(b.charCount||0); },0);
  document.getElementById('exportInfo').innerHTML='Fájl: '+fname+'.json<br>Tartalom: '+projects.length+' projekt • '+(totalChar>1000000?(totalChar/1000000).toFixed(2)+'M':totalChar)+' char';
  document.getElementById('exportModal').classList.add('show');
}

function closeExportModal(){ document.getElementById('exportModal').classList.remove('show'); }

function doExport(){
  let fname=document.getElementById('exportFileName').value.trim()||'export';
  if(!fname.toLowerCase().endsWith('.json')) fname+='.json';
  let dataToExport=projects;
  if(exportMode==='single' && currentId){
    let p=projects.find(function(x){ return x.id==currentId; });
    if(p) dataToExport=[p];
  }
  let blob=new Blob([JSON.stringify(dataToExport,null,2)],{type:'application/json'});
  let a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=fname;
  a.click();
  closeExportModal();
}

function openHtmlExportModal(){
  let code=document.getElementById('codeEditor').value;
  if(!code.trim()){ alert('Üres kód!'); return; }
  let now=new Date();
  let pad=function(n){ return String(n).padStart(2,'0'); };
  let p=projects.find(function(x){ return x.id==currentId; });
  let baseName=(p?p.name:'Html_export')+'_'+now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate())+'_'+pad(now.getHours())+'-'+pad(now.getMinutes())+'-'+pad(now.getSeconds());
  baseName=baseName.replace(/[^a-zA-Z0-9_ -]/g,'').slice(0,50);
  document.getElementById('htmlExportFileName').value=baseName;
  document.getElementById('htmlExportInfo').innerHTML='Fájl: '+baseName+'.html<br>Tartalom: 1 HTML • '+code.length+' char + 100 ablak + uBlock fix';
  document.getElementById('htmlExportModal').classList.add('show');
}

function closeHtmlExportModal(){ document.getElementById('htmlExportModal').classList.remove('show'); }

function doHtmlExport(){
  let code=document.getElementById('codeEditor').value;
  let fname=document.getElementById('htmlExportFileName').value.trim()||'export';
  if(!fname.toLowerCase().endsWith('.html')) fname+='.html';
  let fixScript="<!-- 100 ABLAK + UBLOCK FIX -->\n<script>\n(function(){ var _open=window.open; window.open=function(u,n,s){ try{ return _open.call(window,u,n,s); }catch(e){ var a=document.createElement('a'); a.href=u; a.target=n||'_blank'; a.click(); return null; } }; })();\n<\/script>\n";
  let finalCode=code;
  if(finalCode.toLowerCase().indexOf('</head>')!==-1){
    finalCode=finalCode.replace(/<\/head>/i, fixScript+'</head>');
  } else if(finalCode.toLowerCase().indexOf('<html')!==-1){
    finalCode=finalCode.replace(/<html[^>]*>/i, function(m){ return m+'\n<head>'+fixScript+'</head>'; });
  } else {
    finalCode=fixScript+'\n'+finalCode;
  }
  let blob=new Blob([finalCode],{type:'text/html'});
  let a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=fname;
  a.click();
  closeHtmlExportModal();
}

document.getElementById('fileInput').addEventListener('change', function(e){

  let reader=new FileReader();

    try{

      let parsed=parseUniversal(txt);

        parsed.forEach(function(p){ projects.push(p); });

        saveDB();

  };
  reader.readAsText(f);
});

(function(){
  let resizer=document.getElementById('resizer');
  let codeWrap=document.getElementById('codeWrap');
  let previewWrap=document.getElementById('previewWrap');
  let isDragging=false;
  let startY,startHCode,startHPrev;
  resizer.addEventListener('mousedown', function(e){
    isDragging=true;
    startY=e.clientY;
    startHCode=codeWrap.offsetHeight;
    startHPrev=previewWrap.offsetHeight;
    document.body.style.cursor='ns-resize';
    document.body.style.userSelect='none';
  });
  document.addEventListener('mousemove', function(e){
    if(!isDragging) return;
    let dy=e.clientY-startY;
    let newCodeH=Math.max(100, startHCode+dy);
    let newPrevH=Math.max(100, startHPrev-dy);
    codeWrap.style.flex='none';
    codeWrap.style.height=newCodeH+'px';
    previewWrap.style.flex='none';
    previewWrap.style.height=newPrevH+'px';
  });
  document.addEventListener('mouseup', function(){
    if(isDragging){
      isDragging=false;
      document.body.style.cursor='';
      document.body.style.userSelect='';
      localStorage.setItem('neon_preview_heights', JSON.stringify({code:codeWrap.offsetHeight, preview:previewWrap.offsetHeight}));
    }
  });
  try{
    let saved=JSON.parse(localStorage.getItem('neon_preview_heights')||'null');
    if(saved){ codeWrap.style.flex='none'; codeWrap.style.height=saved.code+'px'; previewWrap.style.flex='none'; previewWrap.style.height=saved.preview+'px'; }
  }catch(e){}
})();

});
document.addEventListener('dragover', function(e){ e.preventDefault(); });
document.addEventListener('drop', function(e){
  e.preventDefault();
  let f=e.dataTransfer.files[0];
  if(!f) return;
  let r=new FileReader();
  r.onload=function(ev){
    let parsed=parseUniversal(ev.target.result);
    if(parsed.length>0){
      parsed.forEach(function(p){ projects.push(p); });
      saveLS();
      saveDB();
      render();
      alert('Drop OK: '+parsed.length+' db');
    }
  };
  r.readAsText(f);
});
