<script>
// NEON V1 FIX - 3 GOMB + SZÁMOZÁS - külsőleg változatlan
document.addEventListener('DOMContentLoaded', function(){
  setTimeout(function(){
    try{
      // 1. KERESSÜK A TOOLBAR-T ÉS A 2 GOMBOT
      let copyBtn = document.querySelector('.btn-copy');
      let runBtn = document.querySelector('.btn-run');
      let toolbar = copyBtn ? copyBtn.parentElement : null;
      
      if(toolbar && copyBtn && runBtn && !document.querySelector('.btn-download')){
        // 2. SÁRGA LETÖLTÉS GOMB LÉTREHOZÁSA - KÉK ELÉ
        let dlBtn = document.createElement('button');
        dlBtn.className = 'btn-download';
        dlBtn.innerText = '📥 LETÖLTÉS';
        dlBtn.style.cssText = 'background:#ffea00 !important;color:#000 !important;border:2px solid #ffea00 !important;box-shadow:0 0 10px #ffea00 !important;border-radius:8px !important;font-weight:bold !important;padding:10px 15px !important;margin-right:6px !important;cursor:pointer !important;';
        dlBtn.onclick = function(){
          try{
            let ed = document.getElementById('editor');
            let text = ed ? ed.value : '';
            if(!text){ alert('Nincs kód!'); return; }
            let fnInput = document.getElementById('fileName');
            let raw = fnInput ? fnInput.value.trim() : 'code';
            let base = raw.replace(/^\d+\.\s*/, '');
            // számlálás a listából
            let list = document.getElementById('fileList');
            let cnt = list ? list.children.length + 1 : 1;
            // ha szerkesztés, tartsuk meg a számot
            let active = document.querySelector('.file-item.active strong');
            if(active){
              let m = active.textContent.match(/^(\d+)\./);
              if(m) cnt = m[1];
            }
            let fname = cnt + '. ' + base;
            let clean = fname.replace(/[^\w\-. ]/g,'_') + '.html';
            let blob = new Blob([text], {type:'text/html;charset=utf-8'});
            let url = URL.createObjectURL(blob);
            let a = document.createElement('a');
            a.href = url; a.download = clean;
            document.body.appendChild(a); a.click();
            setTimeout(function(){try{document.body.removeChild(a); URL.revokeObjectURL(url);}catch(e){}},500);
            // toast ha van
            let toast = document.createElement('div');
            toast.textContent = '📥 LETÖLTVE: ' + clean;
            toast.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#000;border:2px solid #ffea00;color:#ffea00;padding:10px 20px;border-radius:8px;z-index:9999;font-size:12px;';
            document.body.appendChild(toast);
            setTimeout(()=>{try{toast.remove()}catch(e){}},2500);
          }catch(e){ alert('Hiba: '+e.message); }
        };
        toolbar.insertBefore(dlBtn, copyBtn);
        
        // 3. KÉK GOMB ÁTALAKÍTÁSA SAFE COPY-RA (ponttal)
        copyBtn.innerText = 'KÓD MÁSOLÁSA 📋';
        copyBtn.style.background = '#0088ff';
        copyBtn.style.color = '#fff';
        // felülírjuk az onclick-et safe copy-ra
        copyBtn.onclick = function(){
          try{
            let ed = document.getElementById('editor');
            let text = ed ? ed.value : '';
            if(!text) return;
            let safe = '.' + text;
            let ta = document.createElement('textarea');
            ta.value = safe;
            ta.style.position = 'fixed'; ta.style.left = '-9999px';
            document.body.appendChild(ta); ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            let t = document.createElement('div');
            t.textContent = '✅ MÁSOLVA ponttal! Töröld az első pontot!';
            t.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#000;border:2px solid #0088ff;color:#0088ff;padding:10px 20px;border-radius:8px;z-index:9999;font-size:12px;';
            document.body.appendChild(t);
            setTimeout(()=>{try{t.remove()}catch(e){}},2500);
          }catch(e){
            // fallback
            let ed = document.getElementById('editor');
            if(ed && navigator.clipboard){ navigator.clipboard.writeText(ed.value); }
          }
        };
        
        console.log('✅ 3 gomb javítva: sárga letöltés + kék safe copy + zöld futtatás');
      }
      
      // 4. AUTOMATIKUS SZÁMOZÁS NÉV ELŐTT - MENTÉS ELŐTT
      // Figyeljük a Mentés gombot
      function addNumbering(){
        let fileNameInput = document.getElementById('fileName');
        if(!fileNameInput) return;
        // Amikor fókusz elvesztés vagy mentés előtt, számozzuk
        // Intercepteljük a mentés gombokat
        let saveButtons = Array.from(document.querySelectorAll('button')).filter(b=>b.textContent.includes('Mentés')||b.textContent.includes('MENTÉS'));
        saveButtons.forEach(btn=>{
          if(btn.dataset.numberingFixed) return;
          btn.dataset.numberingFixed = '1';
          btn.addEventListener('click', function(e){
            try{
              let input = document.getElementById('fileName');
              if(!input) return;
              let raw = input.value.trim();
              if(!raw) return;
              // ha már van számozás, ne duplázzuk
              if(/^\d+\.\s/.test(raw)) return;
              // ha szerkesztés (van aktív), megtartjuk annak számát
              let active = document.querySelector('.file-item.active strong');
              let base = raw.replace(/^\d+\.\s*/, '');
              let finalName;
              if(active && /^\d+\.\s/.test(active.textContent)){
                let m = active.textContent.match(/^(\d+\.\s*)/);
                finalName = m[1] + base;
              }else{
                let list = document.getElementById('fileList');
                let nextNum = list ? list.children.length + 1 : 1;
                // nézzük IndexedDB count helyett a listát
                finalName = nextNum + '. ' + base;
              }
              input.value = finalName;
              // React state frissítéshez dispatch event
              input.dispatchEvent(new Event('input', {bubbles:true}));
              let nativeInputValueSetter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set;
              // React-hoz kell
              let event = new Event('input', { bubbles: true });
              // trükk React-hoz
              let tracker = input._valueTracker;
              if(tracker){ tracker.setValue(''); }
              input.dispatchEvent(event);
            }catch(err){ console.log('számozás hiba', err); }
          }, true); // capture, mentés előtt fusson
        });
      }
      
      addNumbering();
      setInterval(addNumbering, 1000); // figyeljük ha új gombok jönnek
      
    }catch(e){ console.error('Fix hiba:', e); }
  }, 1500);
});
</script>
